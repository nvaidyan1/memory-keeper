<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Living Portrait</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Living portrait: a painting rigged and animated live on the device.
//
//   ?character=<folder>   which character to show (default dumbledore)
//   ?debug=1              tint the warp regions
//   ?breath=2             scale the breathing
//   ?freeze=7.5           hold the routine at that many seconds (for tuning)
//
// Tap or click the painting to startle him.

const params = new URLSearchParams(location.search);
const base = `characters/${params.get('character') || 'dumbledore'}/`;
const debug = params.has('debug');
const strength = parseFloat(params.get('breath')) || 1;
const freeze = params.has('freeze') ? parseFloat(params.get('freeze')) : null;
const MAX_REGIONS = 8;

const VERT = `
attribute vec2 p;
varying vec2 vUv;
uniform vec2 uCover;
void main() {
  vUv = (vec2(p.x, -p.y) * 0.5) * uCover + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;     // the painting
uniform sampler2D uPlate;   // the painting with the head painted out
uniform sampler2D uRig;     // red = figure mask, green = head weight
uniform float uAspect;      // image width / height
uniform float uLight;       // candle flicker, around zero
uniform vec3 uLamp;         // where the candle light falls: x, y, radius
uniform float uDebug;
uniform vec4 uRegion[${MAX_REGIONS}];  // x, y, radius, unused
uniform vec4 uMove[${MAX_REGIONS}];    // dx, dy, swell, unused (already scaled)
uniform vec2 uPivot;        // neck
uniform vec4 uHead;         // rotation (radians), scale, shift x, shift y
uniform vec4 uEye[2];       // x, y, half width, angle
uniform vec2 uEyeTone;      // brightness of each eye
uniform vec3 uEyeState;     // open 0..1, gaze x, gaze y

vec2 regionShift(vec2 s) {
  vec2 o = vec2(0.0);
  for (int i = 0; i < ${MAX_REGIONS}; i++) {
    vec2 d = s - uRegion[i].xy;
    vec2 dd = d * vec2(uAspect, 1.0);
    float r = max(uRegion[i].z, 0.0001);
    o += exp(-dot(dd, dd) / (r * r)) * (uMove[i].xy + d * uMove[i].z);
  }
  return o;
}

// How far the paint at s has moved.
vec2 shift(vec2 s) {
  vec2 A = vec2(uAspect, 1.0);
  vec2 q = (s - uPivot) * A;
  float c = cos(uHead.x), n = sin(uHead.x);
  vec2 q2 = uHead.y * vec2(c * q.x - n * q.y, n * q.x + c * q.y) + uHead.zw;
  return texture2D(uRig, s).g * (q2 - q) / A + regionShift(s);
}

vec3 paintEye(vec3 col, vec2 s, vec4 eye, float tone) {
  float open = uEyeState.x;
  vec2 e = (s - eye.xy) * vec2(uAspect, 1.0);
  float c = cos(eye.w), n = sin(eye.w);
  e = vec2(c * e.x + n * e.y, -n * e.x + c * e.y) / eye.z;   // x along the eye, y down
  if (abs(e.x) > 1.3 || abs(e.y) > 1.3) return col;
  float arch = max(1.0 - e.x * e.x, 0.0);
  float low = 0.16 * arch;                         // lower lid: the painted lash line
  float up = low - open * 0.62 * pow(arch, 0.7);   // upper lid lifts as the eye opens
  float f = 0.07;
  float inside = smoothstep(0.0, f, e.y - up) * smoothstep(0.0, f, low - e.y) * step(abs(e.x), 1.0);
  inside *= smoothstep(0.0, 0.08, open);

  vec3 white = vec3(0.66, 0.58, 0.50) * (1.0 - 0.35 * e.x * e.x);
  vec2 g = e - vec2(uEyeState.y * 0.42, -0.13 + uEyeState.z * 0.10);
  float rr = length(g);
  vec3 iris = mix(vec3(0.33, 0.39, 0.44), vec3(0.13, 0.15, 0.17), smoothstep(0.15, 0.30, rr));
  vec3 ball = mix(iris, white, smoothstep(0.27, 0.33, rr));
  ball = mix(vec3(0.05, 0.04, 0.04), ball, smoothstep(0.09, 0.14, rr));
  ball += vec3(0.32, 0.30, 0.26) * (1.0 - smoothstep(0.015, 0.05, length(g - vec2(-0.10, -0.10))));
  ball *= 0.55 + 0.45 * smoothstep(0.0, 0.28, e.y - up);    // shadow under the upper lid
  col = mix(col, ball * tone, inside);

  // Dark line of the upper lid.
  float lid = (1.0 - smoothstep(0.0, 0.09, abs(e.y - up))) * step(abs(e.x), 1.0) * arch * smoothstep(0.05, 0.25, open);
  return mix(col, vec3(0.16, 0.09, 0.06) * tone, lid * 0.75);
}

void main() {
  // Find the paint that has moved to this pixel.
  vec2 s = vUv;
  for (int i = 0; i < 4; i++) s = vUv - shift(s);

  vec3 fig = texture2D(uTex, s).rgb;
  fig = paintEye(fig, s, uEye[0], uEyeTone.x);
  fig = paintEye(fig, s, uEye[1], uEyeTone.y);
  // Behind him: the untouched painting, except where he used to be, which needs the plate.
  vec2 b = vUv - regionShift(vUv);
  vec3 bg = mix(texture2D(uTex, b).rgb, texture2D(uPlate, b).rgb, texture2D(uRig, b).r);
  vec3 col = mix(bg, fig, texture2D(uRig, s).r);

  vec2 ld = (vUv - uLamp.xy) * vec2(uAspect, 1.0);
  float glow = exp(-dot(ld, ld) / (uLamp.z * uLamp.z));
  col *= 1.0 + uLight * glow * vec3(1.0, 0.8, 0.5);

  if (uDebug > 0.5) {
    float tint = 0.0;
    for (int i = 0; i < ${MAX_REGIONS}; i++) {
      vec2 dd = (vUv - uRegion[i].xy) * vec2(uAspect, 1.0);
      float r = max(uRegion[i].z, 0.0001);
      tint += exp(-dot(dd, dd) / (r * r)) * step(0.001, uRegion[i].z);
    }
    col = mix(col, vec3(1.0, 0.3, 0.2), min(tint, 1.0) * 0.3);
    col = mix(col, vec3(0.2, 1.0, 0.3), texture2D(uRig, vUv).g * 0.25);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = name => gl.getUniformLocation(prog, name);

function loadImage(src) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => fail(new Error('Could not load ' + src));
    img.src = src;
  });
}

function texture(unit, name, img) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U(name), unit);
}

// Slow rise, slower fall, short rest at the bottom: reads as sleeping breath.
function breath(phase) {
  const p = ((phase % 1) + 1) % 1;
  const ease = x => x * x * (3 - 2 * x);
  if (p < 0.38) return ease(p / 0.38);
  if (p < 0.88) return 1 - ease((p - 0.38) / 0.5);
  return 0;
}

// The pose is a set of named dials. A routine is a list of keyframes; each one
// names the dials it changes, and the rest carry over from the frame before.
const REST = { upright: 0, lift: 0, shift: 0, lean: 0, turn: 0, eyes: 0, gazeX: 0, gazeY: 0, brow: 0, jolt: 0, breathRate: 1 };
const EASE = {
  inout: u => u * u * (3 - 2 * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
};

function prepare(keys) {
  let pose = { ...REST };
  return keys.map(k => {
    const { t, ease, ...dials } = k;
    pose = { ...pose, ...dials };
    return { t, ease: EASE[ease] || EASE.inout, pose };
  });
}

function poseAt(frames, t) {
  if (t <= frames[0].t) return frames[0].pose;
  for (let i = 1; i < frames.length; i++) {
    const a = frames[i - 1], b = frames[i];
    if (t <= b.t) {
      const u = b.ease((t - a.t) / (b.t - a.t));
      const out = {};
      for (const k in REST) out[k] = a.pose[k] + (b.pose[k] - a.pose[k]) * u;
      return out;
    }
  }
  return frames[frames.length - 1].pose;
}

async function main() {
  const ch = await (await fetch(base + 'character.json', { cache: 'no-store' })).json();
  const [img, plate, rig] = await Promise.all([ch.image, ch.plate, ch.rig].map(f => loadImage(base + f)));
  const aspect = img.width / img.height;
  texture(0, 'uTex', img);
  texture(1, 'uPlate', plate);
  texture(2, 'uRig', rig);

  gl.uniform1f(U('uAspect'), aspect);
  gl.uniform1f(U('uDebug'), debug ? 1 : 0);
  const lamp = ch.lamp || { x: 0.5, y: 0.5, r: 10 };
  gl.uniform3f(U('uLamp'), lamp.x, lamp.y, lamp.r);
  gl.uniform2f(U('uPivot'), ch.head.pivotX, ch.head.pivotY);
  const eyeData = new Float32Array(8);
  ch.eyes.slice(0, 2).forEach((e, i) => eyeData.set([e.x, e.y, e.halfWidth, e.angle], i * 4));
  gl.uniform4fv(U('uEye'), eyeData);
  gl.uniform2f(U('uEyeTone'), ch.eyes[0].tone, ch.eyes[1].tone);

  const regions = ch.regions.slice(0, MAX_REGIONS);
  const regionData = new Float32Array(MAX_REGIONS * 4);
  regions.forEach((r, i) => regionData.set([r.x, r.y, r.r, 0], i * 4));
  gl.uniform4fv(U('uRegion'), regionData);
  const moveData = new Float32Array(MAX_REGIONS * 4);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const screen = canvas.width / canvas.height;
    // Fill the screen, cropping whichever side overflows.
    gl.uniform2f(U('uCover'), Math.min(1, screen / aspect), Math.min(1, aspect / screen));
  }
  addEventListener('resize', resize);
  resize();

  // Behaviour: asleep until something startles him, then the routine, then asleep again.
  const routine = prepare(ch.routines['startled-wake']);
  const routineLength = routine[routine.length - 1].t;
  let routineStart = null;          // seconds, or null while asleep
  let nextStartle = 6;              // first one soon after loading, so it can be seen
  const startle = now => { if (routineStart === null) routineStart = now; };
  canvas.addEventListener('pointerdown', () => startle(performance.now() / 1000));

  let last = 0, phase = 0;
  function frame(ms) {
    const t = ms / 1000;
    const dt = Math.min(t - last, 0.1);
    last = t;

    let pose = REST;
    if (freeze !== null) {
      pose = poseAt(routine, freeze);
    } else {
      if (routineStart === null && t >= nextStartle) startle(t);
      if (routineStart !== null) {
        const rt = t - routineStart;
        pose = poseAt(routine, rt);
        if (rt >= routineLength) {
          routineStart = null;
          nextStartle = t + 45 + Math.random() * 60;
        }
      }
    }

    // Breathing keeps its place when its speed changes.
    phase += (freeze !== null ? 0 : dt) / ch.breathSeconds * pose.breathRate;
    const depth = 1 + 0.25 * Math.sin(t * 0.11) + 0.1 * Math.sin(t * 0.047 + 1.3);
    const dial = { ...pose };
    regions.forEach((r, i) => {
      const amount = (r.channel || 'breath') === 'breath'
        ? breath(phase - (r.delay || 0)) * depth * strength
        : dial[r.channel] || 0;
      moveData.set([r.dx * amount, r.dy * amount, r.swell * amount, 0], i * 4);
    });
    gl.uniform4fv(U('uMove'), moveData);

    // A little unsteadiness while awake, so held poses do not look frozen.
    const awake = freeze !== null ? 0 : Math.min(1, pose.eyes * 2);
    const upright = pose.upright + awake * 0.5 * Math.sin(t * 0.9);
    const sway = pose.shift + awake * 0.0006 * Math.sin(t * 1.3);
    // Image y runs downward, so turning toward upright is a negative angle.
    gl.uniform4f(U('uHead'), -upright * Math.PI / 180, 1 + pose.lean, sway, -pose.lift);
    gl.uniform3f(U('uEyeState'), pose.eyes, pose.gazeX, pose.gazeY);

    const f = ch.flicker || 0;
    const flick = 0.5 * Math.sin(t * 2.3) * Math.sin(t * 0.71) + 0.3 * Math.sin(t * 11.0) * Math.sin(t * 5.3) + 0.2 * Math.sin(t * 23.0);
    gl.uniform1f(U('uLight'), f * flick);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main().catch(err => {
  document.body.innerHTML = `<pre style="color:#c88;padding:2em;white-space:pre-wrap">${err.message}\n\nOpen this page through a local server, not as a file.</pre>`;
});
</script>
</body>
</html>
