<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Memory Keeper</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #14110f; color: #eee6d8;
    font: 17px/1.35 -apple-system, system-ui, sans-serif; }
  main { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px;
    max-width: 820px; margin: 0 auto; }
  #view { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: center;
    background: #000; border-radius: 10px; overflow: hidden; }
  #view img { height: 100%; width: 100%; object-fit: contain; display: block; }
  #buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; font-weight: 600; color: #eee6d8; background: #3b3129; border: 1px solid #5a4a3c;
    border-radius: 12px; padding: 0 8px; min-height: 68px; touch-action: manipulation; }
  button:active { background: #6a5543; }
  button.frame { background: #5a2d26; border-color: #86463a; }
  button.on { background: #2f5a3a; border-color: #47855a; }
  #row { display: flex; gap: 10px; }
  #row button { flex: 1; min-height: 52px; }
  #status { background: #1f1a17; border-radius: 10px; padding: 9px 12px; font-size: 15px; min-height: 66px; }
  #ack { color: #d9b36a; }
  .dim { color: #a4988a; }
</style>
</head>
<body>
<main>
  <div id="view"><img id="live" alt="Live view of the character"></div>
  <div id="buttons">
    <button data-cmd="curious">Curious</button>
    <button data-cmd="irritated">Irritated</button>
    <button data-cmd="tired">Tired</button>
    <button data-cmd="read_book">Read book</button>
    <button data-cmd="move_book">Move book</button>
    <button data-cmd="frame_lifted" class="frame">Frame lifted</button>
  </div>
  <div id="row">
    <button id="auto" data-cmd="toggle_auto">Autonomous: off</button>
    <button data-cmd="reset">Reset</button>
  </div>
  <div id="status">
    <div id="ack" class="dim">Connecting…</div>
    <div id="now"></div>
    <div id="stream" class="dim"></div>
  </div>
</main>
<script>
// All behaviour lives in the Godot scene on the Mac. This page only sends
// command names and shows what comes back.
const ack = document.getElementById('ack');
const now = document.getElementById('now');
const stream = document.getElementById('stream');
const auto = document.getElementById('auto');
const live = document.getElementById('live');

function show(status) {
  if (!status) return;
  const doing = status.running.length ? status.running.join(', ') : 'nothing (asleep)';
  now.textContent = `Doing: ${doing} · ${status.activity} · mood ${status.mood}`;
  auto.textContent = 'Autonomous: ' + (status.autonomous ? 'on' : 'off');
  auto.classList.toggle('on', status.autonomous);
  stream.textContent = `Live view ${status.stream_fps.toFixed(0)} frames/s · ${status.encode_ms.toFixed(1)} ms per frame`;
}

async function send(name) {
  ack.className = 'dim';
  ack.textContent = 'Sending ' + name + '…';
  try {
    const answer = await (await fetch('/cmd?name=' + encodeURIComponent(name))).json();
    ack.className = '';
    ack.textContent = answer.reply;
    show(answer.status);
  } catch (error) {
    ack.textContent = 'No answer from the Mac';
  }
}

for (const button of document.querySelectorAll('button[data-cmd]')) {
  button.addEventListener('click', () => send(button.dataset.cmd));
}

async function poll() {
  try {
    show(await (await fetch('/status')).json());
    if (ack.textContent.startsWith('Connecting') || ack.textContent.startsWith('No answer')) {
      ack.textContent = 'Connected';
    }
  } catch (error) {
    ack.className = 'dim';
    ack.textContent = 'No answer from the Mac';
  }
}
setInterval(poll, 700);
poll();

// The live picture. If the stream drops, try again.
function connect() { live.src = '/stream?' + Date.now(); }
live.addEventListener('error', () => setTimeout(connect, 1500));
connect();
</script>
</body>
</html>
